<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ResumeIQ — AI Resume Analyser{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="brand-icon">◈</span>
      ResumeIQ
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% block nav_home %}{% endblock %}">Home</a>
      <a href="/upload/" class="nav-link {% block nav_upload %}{% endblock %}">Analyse</a>
      <a href="/history/" class="nav-link {% block nav_history %}{% endblock %}">History</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>◈ ResumeIQ — AI-Powered Resume Analyser</span>
      <span>Built with Django · NLTK · Scikit-learn</span>
    </div>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
